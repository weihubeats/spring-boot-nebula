spring:
  application:
    name: logback-sample

server:
  port: 8099

nebula:
  log:
    desensitize:
      enabled: true
      # 默认所有环境都脱敏；本地调试需跳过时可配置：
      # disabled-environments:
      #   - dev
      # disable-rules:
      #   - bankCard
    feishu:
      enabled: false
      webhook-url: ${NEBULA_LOG_FEISHU_WEBHOOK_URL:}
      title: logback-sample
      max-per-minute: 10
